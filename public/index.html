<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini X (Vercel Edition)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkBg: '#000000',
            darkCard: '#16181c',
            darkBorder: '#2f3336',
            lightBg: '#ffffff',
            lightCard: '#f7f9f9',
            lightBorder: '#eff3f4',
          }
        }
      }
    }
  </script>
  <style>
    .theme-dark { background-color: #000000; color: #e7e9ea; }
    .theme-dark .bg-card { background-color: #16181c; }
    .theme-dark .border-main { border-color: #2f3336; }
    .theme-dark .input-box { background-color: #202327; color: #fff; }

    .theme-light { background-color: #ffffff; color: #0f1419; }
    .theme-light .bg-card { background-color: #f7f9f9; }
    .theme-light .border-main { border-color: #eff3f4; }
    .theme-light .input-box { background-color: #eff3f4; color: #0f1419; }
  </style>
</head>
<body class="theme-dark font-sans antialiased transition-colors duration-200 min-h-screen">

  <!-- ログイン画面 -->
  <div id="authScreen" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
    <div class="bg-card border border-main rounded-2xl p-6 w-full max-w-sm space-y-4 shadow-xl">
      <h2 class="text-xl font-bold text-center">Mini X ログイン / 登録</h2>
      <div id="authError" class="text-red-500 text-xs text-center hidden"></div>
      <input type="text" id="authUsername" placeholder="ユーザー名" class="w-full input-box border rounded-xl p-3 text-sm focus:outline-none">
      <input type="password" id="authPassword" placeholder="パスワード" class="w-full input-box border rounded-xl p-3 text-sm focus:outline-none">
      <button onclick="submitAuth()" class="w-full bg-[#1d9bf0] text-white font-bold py-3 rounded-xl hover:opacity-90 transition">ログイン / 開始</button>
    </div>
  </div>

  <!-- メインアプリコンテナ -->
  <div id="appContainer" class="max-w-7xl mx-auto flex">
    <!-- サイドバーナビゲーション（Uバー） -->
    <header class="w-20 xl:w-64 h-screen sticky top-0 flex flex-col justify-between p-2 xl:p-4 border-r border-main">
      <div class="space-y-4">
        <h1 class="text-xl font-black px-3 hidden xl:block text-[#1d9bf0]">◆ Mini X (Vercel)</h1>
        <nav class="space-y-1">
          <button onclick="navigateTo('home')" class="w-full flex items-center gap-4 p-3 rounded-full hover:bg-card transition font-bold text-lg">
            <span>🏠</span><span class="hidden xl:block">ホーム</span>
          </button>
          <button onclick="navigateTo('search')" class="w-full flex items-center gap-4 p-3 rounded-full hover:bg-card transition font-bold text-lg">
            <span>🔍</span><span class="hidden xl:block">検索・探索</span>
          </button>
          <button onclick="navigateTo('dmList')" class="w-full flex items-center gap-4 p-3 rounded-full hover:bg-card transition font-bold text-lg">
            <span>📬</span><span class="hidden xl:block">DM一覧</span>
          </button>
          <button id="adminNavBtn" onclick="navigateTo('admin')" class="w-full flex items-center gap-4 p-3 rounded-full hover:bg-card transition font-bold text-lg hidden">
            <span>🛡️</span><span class="hidden xl:block">管理パネル</span>
          </button>
          <button onclick="viewProfile(currentMe)" class="w-full flex items-center gap-4 p-3 rounded-full hover:bg-card transition font-bold text-lg">
            <span>👤</span><span class="hidden xl:block">プロフィール</span>
          </button>
        </nav>
      </div>
      <div class="space-y-2">
        <button onclick="toggleThemeMode()" class="w-full flex items-center gap-2 p-2 rounded-xl bg-card text-xs font-bold justify-center">
          <span>🌓</span><span class="hidden xl:block">テーマ切替</span>
        </button>
        <div class="flex items-center gap-2 p-2 rounded-xl bg-card">
          <div id="myAvatar" class="w-8 h-8 rounded-full bg-slate-500 flex items-center justify-center font-bold text-white overflow-hidden text-xs"></div>
          <div class="hidden xl:block truncate text-xs">
            <p id="myName" class="font-bold truncate"></p>
            <p id="myHandle" class="text-gray-500 truncate"></p>
          </div>
        </div>
      </div>
    </header>

    <!-- メインコンテンツエリア -->
    <main class="flex-1 max-w-2xl border-r border-main min-h-screen pb-20">
      <!-- ヘッダータイトル & 右上オンライン数 -->
      <div class="sticky top-0 bg-opacity-80 backdrop-blur-md bg-card border-b border-main p-4 z-10 flex justify-between items-center">
        <h2 id="pageTitle" class="font-bold text-lg">ホーム</h2>
        <div class="flex items-center gap-1.5 text-xs bg-black/30 border border-main px-3 py-1 rounded-full">
          <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
          <span>オンライン: <strong id="globalOnlineCount">0</strong>人</span>
        </div>
      </div>

      <!-- ツイート投稿フォーム -->
      <div id="tweetFormArea" class="border-b border-main p-4 space-y-3">
        <div id="formContextIndicator" class="hidden text-xs bg-blue-500/10 text-blue-400 p-2 rounded-lg flex justify-between items-center">
          <span id="formContextText"></span>
          <button onclick="cancelFormContext()" class="hover:underline">✕ キャンセル</button>
        </div>
        <div class="flex gap-3">
          <div class="w-10 h-10 rounded-full bg-slate-500 flex items-center justify-center font-bold text-white overflow-hidden flex-shrink-0" id="formAvatar"></div>
          <div class="flex-1 space-y-2">
            <textarea id="tweetInput" placeholder="いまどうしてる？" class="w-full input-box resize-none border-0 focus:outline-none text-sm min-h-[80px] p-1"></textarea>
            <input type="hidden" id="tweetMediaUrlHidden">
            <div class="flex justify-between items-center pt-2 border-t border-main">
              <label class="cursor-pointer text-sm hover:opacity-80">
                📁<input type="file" id="localFileInput" class="hidden" onchange="handleFileSelection(event)">
              </label>
              <button onclick="submitTweet()" class="bg-[#1d9bf0] text-white font-bold px-4 py-1.5 rounded-full text-sm hover:opacity-90 transition">ポストする</button>
            </div>
          </div>
        </div>
      </div>

      <!-- ホームタイムライン -->
      <div id="homeSection">
        <div id="timeline"></div>
        <div class="p-4 text-center">
          <button id="loadMoreBtn" onclick="loadMoreTweets()" class="hidden text-xs text-[#1d9bf0] hover:underline font-bold">さらに読み込む</button>
        </div>
      </div>

      <!-- 検索 -->
      <div id="searchSection" class="hidden p-4 space-y-4">
        <div class="flex gap-2">
          <input type="text" id="globalSearchInput" placeholder="キーワード検索" class="flex-1 input-box border rounded-xl p-2.5 text-sm focus:outline-none">
          <button onclick="executeGlobalSearch()" class="bg-[#1d9bf0] text-white px-4 rounded-xl text-sm font-bold">検索</button>
        </div>
        <div id="searchResultsList" class="space-y-2"></div>
      </div>

      <!-- DM相手一覧セクション -->
      <div id="dmListSection" class="hidden divide-y divide-main">
        <div class="p-4 font-bold text-sm text-gray-400 border-b border-main">メッセージを送受信したユーザー一覧</div>
        <div id="dmPartnersListArea"></div>
      </div>

      <!-- DMチャットセクション -->
      <div id="dmSection" class="hidden flex flex-col h-[calc(100vh-60px)]">
        <div id="dmTargetTitle" class="p-3 border-b border-main font-bold text-sm bg-card"></div>
        <div id="dmChatBox" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col"></div>
        <div class="p-3 border-t border-main flex gap-2 bg-card">
          <input type="text" id="dmInput" placeholder="メッセージを入力..." class="flex-1 input-box border rounded-full px-4 py-2 text-sm focus:outline-none">
          <button onclick="executeSendDM()" class="bg-[#1d9bf0] text-white px-4 py-2 rounded-full text-sm font-bold">送信</button>
        </div>
      </div>

      <!-- プロフィールセクション -->
      <div id="profileSection" class="hidden">
        <div class="p-6 border-b border-main space-y-4">
          <div class="flex justify-between items-start">
            <div class="w-20 h-20 rounded-full bg-slate-500 flex items-center justify-center font-bold text-white text-2xl overflow-hidden" id="profAvatar"></div>
            <div id="profActionArea"></div>
          </div>
          <div>
            <div class="flex items-center gap-1.5 font-bold text-lg">
              <span id="profName"></span><span id="profVerifiedBadge"></span>
            </div>
            <p id="profHandle" class="text-gray-500 text-xs"></p>
          </div>
          <p id="profBio" class="text-sm whitespace-pre-wrap"></p>
        </div>
        <div id="userProfileTweets" class="divide-y divide-main"></div>
      </div>

      <!-- 管理パネルセクション (IP履歴・BAN対応) -->
      <div id="adminSection" class="hidden p-4 space-y-6">
        <div class="space-y-2">
          <h3 class="font-bold text-sm">🛡️ システム監査ログ</h3>
          <div id="adminLogListArea" class="bg-card border border-main rounded-xl p-3 max-h-40 overflow-y-auto space-y-1 text-xs"></div>
        </div>
        <div id="adminRecomBox" class="space-y-2 hidden">
          <h3 class="font-bold text-sm">💡 モデレーターからの昇格推薦</h3>
          <div id="adminRecomListArea" class="bg-card border border-main rounded-xl p-3 max-h-40 overflow-y-auto space-y-1 text-xs"></div>
        </div>
        <div class="space-y-2">
          <h3 class="font-bold text-sm">👥 ユーザー一覧（IPアドレス履歴・BAN管理）</h3>
          <div id="adminUserListArea" class="space-y-2"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    let currentMe = localStorage.getItem('mini_x_me') || "";
    let amIAdmin = false;
    let amIModerator = false;
    let currentSearchType = 'timeline';
    let currentSearchQuery = '';
    let timelineOffset = 0;
    const timelineLimit = 20;
    let activeReplyToId = null;
    let activeRepostOfId = null;
    let activeDMTarget = null;
    let dmIntervalTimer = null;

    window.onload = function() {
      if(!currentMe) {
        document.getElementById('authScreen').classList.remove('hidden');
      } else {
        document.getElementById('authScreen').classList.add('hidden');
        initApp();
      }
    };

    function initApp() {
      fetch(`/api/user/info?username=${encodeURIComponent(currentMe)}`)
        .then(res => res.json())
        .then(info => {
          if(!info) { executeLogout(); return; }
          amIAdmin = info.isAdmin;
          amIModerator = info.isModerator;
          if(amIAdmin || amIModerator) {
            document.getElementById('adminNavBtn').classList.remove('hidden');
          }
          document.getElementById('globalOnlineCount').innerText = info.onlineCount || 1;
          document.getElementById('myName').innerText = currentMe;
          document.getElementById('myHandle').innerText = '@' + currentMe;
          loadTimeline(false);
        });
    }

    function submitAuth() {
      const username = document.getElementById('authUsername').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      if(!username || !password) return;

      fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      })
      .then(res => res.json())
      .then(res => {
        if(!res.success) {
          alert(res.msg);
        } else {
          currentMe = username;
          localStorage.setItem('mini_x_me', username);
          document.getElementById('authScreen').classList.add('hidden');
          initApp();
        }
      });
    }

    function navigateTo(section) {
      if(dmIntervalTimer) { clearInterval(dmIntervalTimer); dmIntervalTimer = null; }
      ['homeSection', 'searchSection', 'dmListSection', 'dmSection', 'profileSection', 'adminSection'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById('tweetFormArea').classList.add('hidden');

      if(section === 'home') {
        document.getElementById('pageTitle').innerText = "ホーム";
        document.getElementById('tweetFormArea').classList.remove('hidden');
        document.getElementById('homeSection').classList.remove('hidden');
        timelineOffset = 0;
        loadTimeline(false);
      } else if(section === 'search') {
        document.getElementById('pageTitle').innerText = "検索・探索";
        document.getElementById('searchSection').classList.remove('hidden');
      } else if(section === 'dmList') {
        document.getElementById('pageTitle').innerText = "DM 相手一覧";
        document.getElementById('dmListSection').classList.remove('hidden');
        loadDMPartnersList();
      } else if(section === 'admin') {
        document.getElementById('pageTitle').innerText = "管理パネル";
        document.getElementById('adminSection').classList.remove('hidden');
        loadAdminPanel();
      }
    }

    function loadTimeline(append = false) {
      fetch(`/api/tweets?offset=${timelineOffset}&limit=${timelineLimit}`)
        .then(res => res.json())
        .then(response => {
          renderTweetsList(response.data, append);
          const btn = document.getElementById('loadMoreBtn');
          if(response.hasMore) btn.classList.remove('hidden');
          else btn.classList.add('hidden');
        });
    }

    function loadMoreTweets() {
      timelineOffset += timelineLimit;
      loadTimeline(true);
    }

    function renderTweetsList(tweets, append) {
      const container = document.getElementById('timeline');
      if(!append) container.innerHTML = '';
      if(tweets.length === 0 && !append) {
        container.innerHTML = `<p class="p-8 text-center text-gray-500 text-sm">投稿はありません</p>`;
        return;
      }

      tweets.forEach(t => {
        const isLiked = t.likes && t.likes.includes(currentMe);
        container.insertAdjacentHTML('beforeend', `
          <div class="p-4 border-b border-main flex gap-3 text-sm">
            <div class="w-10 h-10 rounded-full bg-slate-500 flex items-center justify-center font-bold text-white">${t.user[0].toUpperCase()}</div>
            <div class="flex-1">
              <div class="flex items-center gap-1 font-bold">
                <span>${t.user}</span> <span class="text-gray-500 text-xs">· ${t.timestamp}</span>
              </div>
              <p class="mt-1">${escapeHtml(t.content)}</p>
              <div class="flex gap-4 mt-2 text-xs text-gray-500">
                <button onclick="toggleLike('${t.id}')" class="${isLiked ? 'text-pink-500 font-bold' : ''}">❤️ ${t.likes ? t.likes.length : 0}</button>
                <button onclick="openDMPanel('${t.user}')">📬 DMを送る</button>
              </div>
            </div>
          </div>
        `);
      });
    }

    function toggleLike(tweetId) {
      fetch('/api/tweets/like', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tweetId, username: currentMe })
      }).then(() => loadTimeline(false));
    }

    function submitTweet() {
      const content = document.getElementById('tweetInput').value.trim();
      if(!content) return;
      fetch('/api/tweets/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentMe, content })
      }).then(() => {
        document.getElementById('tweetInput').value = '';
        loadTimeline(false);
      });
    }

    function loadDMPartnersList() {
      fetch(`/api/dm/list?username=${encodeURIComponent(currentMe)}`)
        .then(res => res.json())
        .then(partners => {
          const area = document.getElementById('dmPartnersListArea');
          area.innerHTML = "";
          if(partners.length === 0) {
            area.innerHTML = `<p class="p-8 text-center text-gray-500 text-sm">DM履歴のあるユーザーはいません</p>`;
            return;
          }
          partners.forEach(p => {
            const onlineDot = p.isOnline ? `<span class="w-2.5 h-2.5 rounded-full bg-green-500 inline-block"></span>` : `<span class="w-2.5 h-2.5 rounded-full bg-gray-500 inline-block"></span>`;
            area.insertAdjacentHTML('beforeend', `
              <div onclick="openDMPanel('${p.partner}')" class="p-4 hover:bg-card cursor-pointer flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-full bg-slate-600 flex items-center justify-center font-bold text-white">${p.partner[0].toUpperCase()}</div>
                  <div>
                    <div class="flex items-center gap-2 font-bold text-sm">
                      <span>@${p.partner}</span> ${onlineDot} <span class="text-[10px] text-gray-400">${p.isOnline ? 'オンライン' : 'オフライン'}</span>
                    </div>
                    <p class="text-xs text-gray-500 truncate max-w-xs">${escapeHtml(p.lastMessage)}</p>
                  </div>
                </div>
                <span class="text-xs text-gray-400">${p.timestamp}</span>
              </div>
            `);
          });
        });
    }

    function openDMPanel(targetUser) {
      navigateTo('none');
      activeDMTarget = targetUser;
      document.getElementById('pageTitle').innerText = `@${targetUser} とのDM`;
      document.getElementById('dmSection').classList.remove('hidden');
      loadDMChatLogs();
      dmIntervalTimer = setInterval(loadDMChatLogs, 3000);
    }

    function loadDMChatLogs() {
      fetch(`/api/dm/chat?user1=${encodeURIComponent(currentMe)}&user2=${encodeURIComponent(activeDMTarget)}`)
        .then(res => res.json())
        .then(logs => {
          const box = document.getElementById('dmChatBox');
          box.innerHTML = "";
          logs.forEach(l => {
            const isMe = l.from === currentMe;
            box.insertAdjacentHTML('beforeend', `
              <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                <div class="${isMe ? 'bg-[#1d9bf0] text-white' : 'bg-card'} px-3 py-2 rounded-2xl max-w-xs text-xs">
                  ${escapeHtml(l.message)}
                </div>
                <span class="text-[9px] text-gray-500 mt-0.5">${l.timestamp}</span>
              </div>
            `);
          });
          box.scrollTop = box.scrollHeight;
        });
    }

    function executeSendDM() {
      const input = document.getElementById('dmInput');
      const message = input.value.trim();
      if(!message) return;
      fetch('/api/dm/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ from: currentMe, to: activeDMTarget, message })
      }).then(res => res.json()).then(res => {
        if(!res.success) alert(res.msg);
        else { input.value = ''; loadDMChatLogs(); }
      });
    }

    function loadAdminPanel() {
      fetch(`/api/admin/data?username=${encodeURIComponent(currentMe)}`)
        .then(res => res.json())
        .then(payload => {
          if(!payload) return;
          const logArea = document.getElementById('adminLogListArea');
          logArea.innerHTML = payload.logs.map(l => `<div>[${l.timestamp}] @${l.operator} -> @${l.target}: ${l.action}</div>`).join('') || 'ログなし';

          const userArea = document.getElementById('adminUserListArea');
          userArea.innerHTML = "";
          payload.users.forEach(u => {
            const ips = u.ipHistory ? u.ipHistory.join(', ') : '記録なし';
            userArea.insertAdjacentHTML('beforeend', `
              <div class="p-3 bg-card border border-main rounded-xl text-xs space-y-1">
                <div class="flex justify-between items-center font-bold">
                  <span>@${u.username} ${u.banned ? '(BAN済)' : ''}</span>
                  <div class="flex gap-2">
                    <button onclick="adminBan('${u.username}')" class="bg-red-600 text-white px-2 py-1 rounded">IP BAN</button>
                  </div>
                </div>
                <p class="text-gray-400">IP履歴: ${ips}</p>
              </div>
            `);
          });
        });
    }

    function adminBan(target) {
      if(!confirm(`@${target} をIPベースでBANしますか？`)) return;
      fetch('/api/admin/ban', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ operator: currentMe, target })
      }).then(res => res.json()).then(res => {
        alert(res.msg);
        loadAdminPanel();
      });
    }

    function viewProfile(username) {
      navigateTo('none');
      document.getElementById('pageTitle').innerText = "プロフィール";
      document.getElementById('profileSection').classList.remove('hidden');
      fetch(`/api/user/profile?username=${encodeURIComponent(username)}&currentMe=${encodeURIComponent(currentMe)}`)
        .then(res => res.json())
        .then(p => {
          document.getElementById('profName').innerText = p.username;
          document.getElementById('profHandle').innerText = '@' + p.username;
          document.getElementById('profBio').innerText = p.bio;
        });
    }

    function handleFileSelection(e) {
      const file = e.target.files[0];
      if(!file) return;
      const formData = new FormData();
      formData.append('file', file);
      fetch('/api/upload', { method: 'POST', body: formData })
        .then(res => res.text()).then(url => {
          document.getElementById('tweetMediaUrlHidden').value = url;
          alert('アップロード完了');
        });
    }

    function executeLogout() { localStorage.clear(); location.reload(); }
    function toggleThemeMode() { document.body.className = document.body.className.includes('dark') ? 'theme-light font-sans antialiased' : 'theme-dark font-sans antialiased'; }
    function escapeHtml(str) { return str ? str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') : ''; }
  </script>
</body>
</html>
