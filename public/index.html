<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Ultra</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen">
  <div id="app" class="max-w-7xl mx-auto flex">
    <!-- アプリのUI部分 -->
    <div id="main-container" class="w-full flex"></div>
  </div>

  <script>
    let currentUser = localStorage.getItem('x_user') || null;
    let currentTab = 'home';
    let activeChatUser = null;
    let activeProfileUser = null;
    let autoRefreshTimer = null;

    function render() {
      const container = document.getElementById('main-container');
      if (!currentUser) {
        container.innerHTML = `
          <div class="w-full max-w-md mx-auto mt-20 p-6 bg-gray-900 rounded-xl border border-gray-800">
            <h1 class="text-2xl font-bold mb-6 text-center">X Ultra へログイン</h1>
            <div id="auth-msg" class="text-red-500 mb-4 text-sm text-center"></div>
            <input id="auth-user" type="text" placeholder="ユーザーID" class="w-full mb-3 p-3 bg-black border border-gray-700 rounded text-white">
            <input id="auth-pass" type="password" placeholder="パスワード" class="w-full mb-3 p-3 bg-black border border-gray-700 rounded text-white">
            <input id="auth-admin" type="text" placeholder="管理者キー（任意）" class="w-full mb-4 p-3 bg-black border border-gray-700 rounded text-white text-xs">
            <button onclick="handleLogin()" class="w-full bg-blue-500 hover:bg-blue-600 p-3 rounded font-bold mb-2">ログイン</button>
            <button onclick="handleRegister()" class="w-full bg-gray-800 hover:bg-gray-700 p-3 rounded font-bold text-sm">新規アカウント作成</button>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="w-64 border-r border-gray-800 p-4 hidden md:block h-screen sticky top-0 flex flex-col justify-between">
          <div>
            <h1 class="text-xl font-bold mb-6 px-2 text-blue-400">𝕏 Ultra</h1>
            <nav class="space-y-2">
              <button onclick="switchTab('home')" class="w-full text-left px-4 py-2 rounded hover:bg-gray-900 ${currentTab==='home'?'font-bold text-blue-400':''}">ホーム</button>
              <button onclick="switchTab('search')" class="w-full text-left px-4 py-2 rounded hover:bg-gray-900 ${currentTab==='search'?'font-bold text-blue-400':''}">検索・トレンド</button>
              <button onclick="switchTab('notifs')" class="w-full text-left px-4 py-2 rounded hover:bg-gray-900 ${currentTab==='notifs'?'font-bold text-blue-400':''}">通知</button>
              <button onclick="switchTab('dm')" class="w-full text-left px-4 py-2 rounded hover:bg-gray-900 ${currentTab==='dm'?'font-bold text-blue-400':''}">メッセージ</button>
              <button onclick="switchTab('profile'); viewProfile('${currentUser}')" class="w-full text-left px-4 py-2 rounded hover:bg-gray-900 ${currentTab==='profile'?'font-bold text-blue-400':''}">プロフィール</button>
              <button onclick="switchTab('admin')" class="w-full text-left px-4 py-2 rounded hover:bg-gray-900 ${currentTab==='admin'?'font-bold text-blue-400':''}">管理パネル</button>
            </nav>
          </div>
          <div>
            <div class="text-sm text-gray-400 mb-2 truncate px-2">@${currentUser}</div>
            <button onclick="handleLogout()" class="w-full text-left px-4 py-2 rounded hover:bg-red-950 text-red-400 text-sm">ログアウト</button>
          </div>
        </div>
        <div class="flex-1 min-h-screen border-r border-gray-800 pb-20 md:pb-0" id="content-area"></div>
        <div class="w-80 p-4 hidden lg:block h-screen sticky top-0 overflow-y-auto" id="sidebar-online"></div>
      `;

      renderContentArea();
      renderOnlineSidebar();
      startAutoRefresh();
    }

    function switchTab(tab) {
      currentTab = tab;
      renderContentArea();
    }

    function startAutoRefresh() {
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(() => {
        if (!currentUser) return;
        if (currentTab === 'home' || currentTab === 'search') {
          refreshFeedSilently();
        } else if (currentTab === 'dm' && activeChatUser) {
          refreshChatSilently();
        }
        renderOnlineSidebar();
      }, 5000);
    }

    async function refreshFeedSilently() {
      const res = await fetch(`/api/tweets?searchType=${currentTab==='home'?'follow':'keyword'}&currentMe=${currentUser}`);
      const json = await res.json();
      const feedDiv = document.getElementById('feed-container');
      if (feedDiv && json.data) {
        // フィードの内容を更新
        feedDiv.innerHTML = json.data.map(t => tweetHtml(t)).join('');
      }
    }

    async function refreshChatSilently() {
      if (!activeChatUser) return;
      const res = await fetch(`/api/dm/chat?userA=${currentUser}&userB=${activeChatUser}`);
      const logs = await res.json();
      const chatLogsDiv = document.getElementById('chat-logs');
      if (chatLogsDiv) {
        chatLogsDiv.innerHTML = logs.map(l => `
          <div class="mb-3 flex ${l.from === currentUser ? 'justify-end' : 'justify-start'}">
            <div class="p-3 rounded-lg max-w-xs text-sm ${l.from === currentUser ? 'bg-blue-600 text-white' : 'bg-gray-800 text-white'}">
              <div class="text-xs text-gray-400 mb-1">@${l.from}</div>
              <div>${escapeHtml(l.message)}</div>
            </div>
          </div>
        `).join('');
      }
    }

    async function renderContentArea() {
      const area = document.getElementById('content-area');
      if (currentTab === 'home') {
        area.innerHTML = `
          <div class="p-4 border-b border-gray-800 font-bold text-lg sticky top-0 bg-black/80 backdrop-blur z-10">ホーム</div>
          <div class="p-4 border-b border-gray-800">
            <textarea id="tweet-text" placeholder="いまどうしてる？" class="w-full bg-black text-white resize-none outline-none min-h-[80px]"></textarea>
            <div id="tweet-status" class="text-blue-400 text-xs mb-2 h-4"></div>
            <div class="flex justify-between items-center mt-2">
              <input id="tweet-media" type="text" placeholder="画像URL（任意）" class="bg-gray-900 text-xs p-2 rounded border border-gray-800 w-1/2 text-white">
              <button id="tweet-btn" onclick="postTweet()" class="bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded-full font-bold text-sm">ポストする</button>
            </div>
          </div>
          <div id="feed-container"></div>
        `;
        loadFeed('follow');
      } else if (currentTab === 'search') {
        area.innerHTML = `
          <div class="p-4 border-b border-gray-800 sticky top-0 bg-black/80 backdrop-blur z-10">
            <input id="search-input" type="text" placeholder="キーワードで検索" oninput="searchTweets()" class="w-full p-2 bg-gray-900 border border-gray-800 rounded text-white text-sm">
          </div>
          <div id="feed-container"></div>
        `;
        loadFeed('keyword', '');
      } else if (currentTab === 'notifs') {
        area.innerHTML = `<div class="p-4 border-b border-gray-800 font-bold text-lg">通知</div><div id="notifs-list"></div>`;
        loadNotifs();
      } else if (currentTab === 'dm') {
        area.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-3 h-screen">
            <div class="border-r border-gray-800 overflow-y-auto p-2" id="dm-contacts"></div>
            <div class="col-span-2 flex flex-col h-full" id="dm-chat-pane">
              <div class="p-4 text-gray-500 text-center m-auto">チャットを選択してください</div>
            </div>
          </div>
        `;
        loadDmContacts();
      } else if (currentTab === 'profile') {
        renderProfilePane(area);
      } else if (currentTab === 'admin') {
        renderAdminPane(area);
      }
    }

    async function loadFeed(searchType, searchQuery = '') {
      const res = await fetch(`/api/tweets?searchType=${searchType}&searchQuery=${encodeURIComponent(searchQuery)}&currentMe=${currentUser}`);
      const json = await res.json();
      const feedDiv = document.getElementById('feed-container');
      if (feedDiv && json.data) {
        feedDiv.innerHTML = json.data.map(t => tweetHtml(t)).join('');
      }
    }

    function tweetHtml(t) {
      return `
        <div class="p-4 border-b border-gray-800 hover:bg-gray-950 transition">
          <div class="flex items-center mb-1">
            <span class="font-bold cursor-pointer text-sm" onclick="switchTab('profile'); viewProfile('${t.user}')">@${t.user}</span>
            <span class="text-xs text-gray-500 ml-2">${t.timestamp}</span>
          </div>
          <div class="text-sm mb-2 whitespace-pre-wrap">${escapeHtml(t.content)}</div>
          ${t.mediaUrl ? `<img src="${t.mediaUrl}" class="rounded-lg max-h-60 mb-2 border border-gray-800">` : ''}
          <div class="flex space-x-6 text-xs text-gray-500">
            <button onclick="likeTweet('${t.id}')" class="hover:text-pink-500">❤️ ${(t.likes||[]).length}</button>
            ${t.user === currentUser ? `<button onclick="deleteTweet('${t.id}')" class="hover:text-red-500">削除</button>` : ''}
          </div>
        </div>
      `;
    }

    async function postTweet() {
      const text = document.getElementById('tweet-text').value;
      const media = document.getElementById('tweet-media').value;
      const statusDiv = document.getElementById('tweet-status');
      const btn = document.getElementById('tweet-btn');

      if (!text && !media) return;

      btn.disabled = true;
      statusDiv.textContent = "サーバーに接続中...";

      try {
        const res = await fetch('/api/tweets', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username: currentUser, textContent: text, mediaUrl: media })
        });
        const json = await res.json();
        if (json.success) {
          document.getElementById('tweet-text').value = '';
          document.getElementById('tweet-media').value = '';
          statusDiv.textContent = "";
          loadFeed('follow');
        } else {
          statusDiv.textContent = json.msg || "投稿に失敗しました";
        }
      } catch (e) {
        statusDiv.textContent = "通信エラーが発生しました";
      } finally {
        btn.disabled = false;
      }
    }

    async function likeTweet(id) {
      await fetch('/api/tweets/like', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ tweetId: id, username: currentUser })
      });
      refreshFeedSilently();
    }

    async function deleteTweet(id) {
      await fetch(`/api/tweets/${id}`, {
        method: 'DELETE',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username: currentUser })
      });
      refreshFeedSilently();
    }

    async function searchTweets() {
      const q = document.getElementById('search-input').value;
      loadFeed('keyword', q);
    }

    async function loadNotifs() {
      const res = await fetch(`/api/notifs/${currentUser}`);
      const list = await res.json();
      const div = document.getElementById('notifs-list');
      if (div) {
        div.innerHTML = list.map(n => `<div class="p-4 border-b border-gray-800 text-sm">${escapeHtml(n.content)} <span class="text-xs text-gray-500 block mt-1">${n.timestamp}</span></div>`).join('');
      }
    }

    async function loadDmContacts() {
      const res = await fetch(`/api/dm/conversations/${currentUser}`);
      const contacts = await res.json();
      const div = document.getElementById('dm-contacts');
      if (div) {
        div.innerHTML = contacts.map(c => `
          <div onclick="openChat('${c.username}')" class="p-3 border-b border-gray-800 cursor-pointer hover:bg-gray-900 rounded flex justify-between items-center">
            <span class="text-sm font-bold">@${c.username}</span>
            <span class="w-2 h-2 rounded-full ${c.isOnline ? 'bg-green-500' : 'bg-gray-600'}"></span>
          </div>
        `).join('');
      }
    }

    async function openChat(targetUser) {
      activeChatUser = targetUser;
      const pane = document.getElementById('dm-chat-pane');
      pane.innerHTML = `
        <div class="p-4 border-b border-gray-800 font-bold text-sm">@${targetUser} とのメッセージ</div>
        <div class="flex-1 p-4 overflow-y-auto" id="chat-logs"></div>
        <div class="p-4 border-t border-gray-800 flex">
          <input id="chat-msg" type="text" placeholder="メッセージを入力..." class="flex-1 bg-gray-900 border border-gray-800 rounded p-2 text-sm text-white mr-2">
          <button id="dm-send-btn" onclick="sendDm('${targetUser}')" class="bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded text-sm font-bold">送信</button>
        </div>
      `;
      refreshChatSilently();
    }

    async function sendDm(targetUser) {
      const input = document.getElementById('chat-msg');
      const btn = document.getElementById('dm-send-btn');
      const msg = input.value;
      if (!msg) return;

      btn.disabled = true;
      input.disabled = true;

      await fetch('/api/dm/send', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ fromUser: currentUser, toUser: targetUser, message: msg })
      });

      input.value = '';
      btn.disabled = false;
      input.disabled = false;
      input.focus();
      refreshChatSilently();
    }

    async function viewProfile(username) {
      activeProfileUser = username;
      const res = await fetch(`/api/profile/${username}?viewer=${currentUser}`);
      const data = await res.json();
      const area = document.getElementById('content-area');
      if (area && currentTab === 'profile') {
        renderProfilePane(area, data, username);
      }
    }

    function renderProfilePane(area, data = null, targetUser = currentUser) {
      area.innerHTML = `
        <div class="p-4 border-b border-gray-800 font-bold text-lg">@${targetUser} のプロフィール</div>
        <div class="p-6">
          <div class="flex justify-between items-center mb-4">
            <div>
              <div class="text-xl font-bold">@${targetUser}</div>
              <div class="text-xs text-gray-500 mt-1">${data && data.isOnline ? '● オンライン' : '○ オフライン'}</div>
            </div>
            ${targetUser !== currentUser ? `
              <div class="space-x-2">
                <button onclick="toggleFollow('${targetUser}')" class="bg-white text-black px-4 py-2 rounded-full font-bold text-sm">${data && data.isFollowing ? 'フォロー中' : 'フォローする'}</button>
                <button onclick="switchTab('dm'); openChat('${targetUser}')" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-full font-bold text-sm">DMを送る</button>
              </div>
            ` : ''}
          </div>
          <div class="text-sm mb-4 text-gray-300" id="profile-bio">${data ? escapeHtml(data.bio) : ''}</div>
          <div class="flex space-x-4 text-xs text-gray-500 mb-6">
            <span><b>${data ? data.followingCount : 0}</b> フォロー中</span>
            <span><b>${data ? data.followerCount : 0}</b> フォロワー</span>
          </div>
          ${targetUser === currentUser ? `
            <div class="border-t border-gray-800 pt-4">
              <h3 class="font-bold text-sm mb-2">プロフィール編集</h3>
              <textarea id="edit-bio" class="w-full bg-gray-900 border border-gray-800 p-2 text-sm rounded mb-2 text-white">${data ? data.bio : ''}</textarea>
              <button onclick="updateProfile()" class="bg-blue-500 px-4 py-2 rounded text-sm font-bold">保存する</button>
            </div>
          ` : ''}
        </div>
      `;
    }

    async function toggleFollow(targetUser) {
      await fetch('/api/follow', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username: currentUser, targetUser })
      });
      viewProfile(targetUser);
    }

    async function updateProfile() {
      const bio = document.getElementById('edit-bio').value;
      await fetch('/api/profile/update', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username: currentUser, bio })
      });
      alert('プロフィールを更新しました');
      viewProfile(currentUser);
    }

    async function renderOnlineSidebar() {
      const res = await fetch('/api/online-users');
      const json = await res.json();
      const div = document.getElementById('sidebar-online');
      if (div) {
        div.innerHTML = `
          <div class="bg-gray-900 p-4 rounded-xl border border-gray-800">
            <h3 class="font-bold text-sm mb-3">オンラインのユーザー (${json.count})</h3>
            <div class="space-y-2">
              ${json.users.map(u => `
                <div onclick="switchTab('profile'); viewProfile('${u.username}')" class="flex items-center cursor-pointer hover:bg-gray-800 p-2 rounded">
                  <span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span>
                  <span class="text-sm truncate">@${u.username}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    }

    async function renderAdminPane(area) {
      const res = await fetch('/api/admin/data');
      const json = await res.json();
      area.innerHTML = `
        <div class="p-4 border-b border-gray-800 font-bold text-lg">管理パネル</div>
        <div class="p-4">
          <h3 class="font-bold text-sm mb-2 text-blue-400">ユーザー一覧 & IPアドレス履歴</h3>
          <div class="space-y-3 mb-6">
            ${Object.keys(json.users || {}).map(u => {
              const uObj = json.users[u];
              const ip = (json.ipLogs && json.ipLogs[u]) || uObj.ipAddress || '不明';
              return `
                <div class="p-3 bg-gray-900 border border-gray-800 rounded flex justify-between items-center text-sm">
                  <div>
                    <span class="font-bold">@${u}</span>
                    <div class="text-xs text-gray-400">IP: ${ip} | 状態: ${uObj.isOnline ? 'オンライン' : 'オフライン'}</div>
                  </div>
                  <button onclick="adminAction('${u}', 'ban')" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-xs font-bold">BAN</button>
                </div>
              `;
            }).join('')}
          </div>
          <h3 class="font-bold text-sm mb-2 text-blue-400">システムログ</h3>
          <div class="bg-gray-900 p-3 rounded border border-gray-800 text-xs font-mono space-y-1 max-h-40 overflow-y-auto">
            ${(json.logs || []).map(l => `<div>[${l.timestamp}] ${l.user} - ${l.action}: ${l.details}</div>`).join('')}
          </div>
        </div>
      `;
    }

    async function adminAction(targetUser, action) {
      await fetch('/api/admin/action', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ action, targetUser, adminUser: currentUser })
      });
      renderContentArea();
    }

    async function handleLogin() {
      const u = document.getElementById('auth-user').value;
      const p = document.getElementById('auth-pass').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username: u, password: p })
      });
      const json = await res.json();
      if (json.success) {
        currentUser = u;
        localStorage.setItem('x_user', u);
        render();
      } else {
        document.getElementById('auth-msg').textContent = json.msg;
      }
    }

    async function handleRegister() {
      const u = document.getElementById('auth-user').value;
      const p = document.getElementById('auth-pass').value;
      const adminKey = document.getElementById('auth-admin').value;
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username: u, password: p, adminPassword: adminKey })
      });
      const json = await res.json();
      if (json.success) {
        currentUser = u;
        localStorage.setItem('x_user', u);
        render();
      } else {
        document.getElementById('auth-msg').textContent = json.msg;
      }
    }

    function handleLogout() {
      localStorage.removeItem('x_user');
      currentUser = null;
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      render();
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    render();
  </script>
</body>
</html>
